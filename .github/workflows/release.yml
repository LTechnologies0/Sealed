name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.3.13750724
            cmake;3.22.1

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Verify signing secrets
        run: |
          missing=0
          for var in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set. See README, section signature CI."
              missing=1
            fi
          done
          exit "$missing"

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify MTE and signatures for every ABI
        run: |
          set -euo pipefail
          chmod +x scripts/verify-memtag-manifest.sh
          ./scripts/verify-memtag-manifest.sh \
            app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            apk="app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::Missing signed APK for ${abi}"
              exit 1
            fi
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Package APKs with checksums
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/release
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            apk="app/build/outputs/apk/release/app-${abi}-release.apk"
            cp "$apk" "dist/release/sealed-${VERSION}-${abi}.apk"
            echo "- \`sealed-${VERSION}-${abi}.apk\`" >> dist/release/ABI_LIST.md
          done
          (cd dist/release && sha256sum sealed-*.apk > SHA256SUMS.txt)
          {
            echo "## Sealed ${VERSION}"
            echo
            echo "APK release signés, un par architecture. Téléphones : **arm64-v8a**."
            echo "MTE est intégré (\`android:memtagMode=async\`) et ignoré sur le matériel sans MTE."
            echo
            echo "### Assets"
            cat dist/release/ABI_LIST.md
            echo
            echo "Vérifier : \`sha256sum -c SHA256SUMS.txt\`"
          } > dist/release/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Sealed ${{ steps.meta.outputs.version }}
          body_path: dist/release/RELEASE_NOTES.md
          files: |
            dist/release/sealed-*.apk
            dist/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
